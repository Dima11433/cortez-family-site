<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <!-- Background Vignette Radial -->
    <radialGradient id="floryDarkBg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#180a11" />
      <stop offset="70%" stop-color="#0b0609" />
      <stop offset="100%" stop-color="#050304" />
    </radialGradient>

    <!-- Crimson Flame Gradient -->
    <linearGradient id="crimsonFlame" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF1E56" />
      <stop offset="50%" stop-color="#FF3366" />
      <stop offset="100%" stop-color="#FF758C" />
    </linearGradient>

    <!-- Amber Fire Accent Gradient -->
    <linearGradient id="amberFlame" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF9F43" />
      <stop offset="50%" stop-color="#FF5252" />
      <stop offset="100%" stop-color="#C2185B" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="crimsonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="subtleGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Hexagonal / Shield Background -->
  <polygon points="250,20 450,110 450,370 250,470 50,370 50,110" fill="url(#floryDarkBg)" stroke="url(#crimsonFlame)" stroke-width="4" filter="url(#subtleGlow)" />
  <polygon points="250,35 435,120 435,360 250,455 65,360 65,120" fill="none" stroke="rgba(255, 51, 102, 0.25)" stroke-width="1.5" stroke-dasharray="6,4" />

  <!-- Phoenix Wings Left -->
  <path d="M250,220 C210,180 140,150 90,180 C80,210 110,240 150,250 C120,260 100,290 120,320 C150,320 190,290 220,270 C190,290 170,330 190,360 C210,360 235,310 250,280 Z" fill="url(#crimsonFlame)" opacity="0.9" filter="url(#crimsonGlow)"/>

  <!-- Phoenix Wings Right -->
  <path d="M250,220 C290,180 360,150 410,180 C420,210 390,240 350,250 C380,260 400,290 380,320 C350,320 310,290 280,270 C310,290 330,330 310,360 C290,360 265,310 250,280 Z" fill="url(#crimsonFlame)" opacity="0.9" filter="url(#crimsonGlow)"/>

  <!-- Phoenix Crown & Head (Fire Bird) -->
  <path d="M250,95 L262,130 L275,115 L268,145 L250,175 L232,145 L225,115 L238,130 Z" fill="url(#amberFlame)" filter="url(#subtleGlow)" />
  <polygon points="250,140 256,155 250,170 244,155" fill="#FFFFFF" />

  <!-- Center Monogram: FLORY 'F' Emblem -->
  <g transform="translate(200, 190)">
    <!-- Stylized Sharp Gothic 'F' -->
    <path d="M20,10 L85,10 L85,25 L45,25 L45,45 L80,45 L80,60 L45,60 L45,110 L20,110 Z" fill="#FFFFFF" filter="url(#subtleGlow)" />
    <path d="M30,15 L80,15 L80,22 L40,22 L40,50 L75,50 L75,57 L40,57 L40,105 L30,105 Z" fill="url(#amberFlame)" opacity="0.8" />
  </g>

  <!-- Banner Ribbon / Label at Bottom -->
  <g transform="translate(0, 375)">
    <!-- Ribbon Base -->
    <polygon points="120,30 380,30 365,65 135,65" fill="#14060b" stroke="url(#crimsonFlame)" stroke-width="2" />
    <polygon points="110,38 125,30 135,65 120,73 95,52" fill="#880e4f" />
    <polygon points="390,38 375,30 365,65 380,73 405,52" fill="#880e4f" />
    
    <!-- Text: FLORY -->
    <text x="250" y="55" font-family="'Cinzel', 'Trajan Pro', Georgia, serif" font-size="24" font-weight="900" fill="#FFFFFF" text-anchor="middle" letter-spacing="6">FLORY</text>
  </g>

  <!-- Subtitle Tag: PHOENIX #15 -->
  <text x="250" y="460" font-family="'Inter', -apple-system, sans-serif" font-size="12" font-weight="700" fill="#FF5252" text-anchor="middle" letter-spacing="4">PHOENIX #15</text>
  
  <!-- Subtle Stars / Accents -->
  <circle cx="160" cy="115" r="2.5" fill="#FF3366" filter="url(#crimsonGlow)" />
  <circle cx="340" cy="115" r="2.5" fill="#FF3366" filter="url(#crimsonGlow)" />
</svg>